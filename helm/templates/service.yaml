apiVersion: v1
kind: Service
metadata:
  name: svc-{{ include "ala-userdetails.fullname" . }}
  labels:
    {{- include "ala-userdetails.labels" . | nindent 4 }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "key1=value1,key2=value2,{{ .Values.aws.resourceTags }}"
spec:
  type: LoadBalancer
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort}}
      protocol: TCP
  selector:
    {{- include "ala-userdetails.selectorLabels" . | nindent 4 }}