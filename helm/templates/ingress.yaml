{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-{{ include "ala-userdetails.fullname" . }}
  annotations:
    alb.ingress.kubernetes.io/tags: "envronment={{ .Values.aws.resourceTags.environment }},product={{ .Values.aws.resourceTags.product }},branch={{ .Values.aws.resourceTags.branch }},component={{ .Values.aws.resourceTags.component }}"
    kubernetes.io/ingress.class: {{ .Values.ingress.className }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/success-codes: 200,404,301,302
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.ingress.hostname }}
    {{- include "ala-userdetails.labels" . | nindent 4 }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host:  {{ .Values.ingress.hostname }}
      http:
        paths:
        - pathType: Prefix
          path: /
          backend:
            service:
              name: svc-{{ include "ala-userdetails.fullname" . }}
              port:
                number: {{ .Values.service.port }}
{{- end }}