AWSTemplateFormatVersion: '2010-09-09'

Description: Base resources for the Userdetails service

Parameters:
  pBuild:
    Type: String
    Description: The build number
  pCleanBranch:
    Type: String
    Description: The clean branch, can be used in resource names
  pEnvironment:
    Type: String
    Description: The AWS environment this belongs to
  pProductName:
    Type: String
    Description: The name of the product
  pOidcConnectProvider:
    Type: String
    Description: The OIDC connect provider
  pServiceAccountName:
    Type: String
    Description: The name of the service account

Conditions:

  IsDev: !Equals
    - !Ref pEnvironment
    - development
  NotProd: !Not
    - !Equals
      - !Ref pEnvironment
      - production

Resources:

  UserdetailsRepository:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: !If [ NotProd, true, false ]
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      RepositoryName: !Sub
                         - ${pProductName}-${ResourceName}
                         - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      RepositoryPolicyText:
        Version: 2012-10-17
        Statement:
          - Sid: AllowPublicPull
            Effect: Allow
            Principal: '*'
            Action:
              - 'ecr:GetDownloadUrlForLayer'
              - 'ecr:BatchGetImage'
              - 'ecr:BatchCheckLayerAvailability'
      Tags:
        - Key: Environment
          Value: !Ref pEnvironment
        - Key: Branch
          Value: !Ref pCleanBranch

  UserdetailsSecret:
    Type: 'AWS::SecretsManager::Secret'
    Properties:
      Name: !Sub 
              - ${pProductName}-${ResourceName}
              - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      Description: !Sub Userdetails app ${pEnvironment} secrets

  UserdetailsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: !Sub Permissions to deploy ${pProductName}
      ManagedPolicyName: !Sub 
                           - ${pProductName}-policy-${ResourceName}
                           - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendTemplatedEmail
              - ses:SendRawEmail
            Resource:
              - "*"
          - Effect: Allow
            Action:
              - apigateway:POST
              - apigateway:GET
            Resource:
              - "*"
          - Effect: Allow
            Action:
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:UpdateTimeToLive
              - dynamodb:ConditionCheckItem
              - dynamodb:PutItem
              - dynamodb:DeleteItem
              - dynamodb:Scan
              - dynamodb:ListTagsOfResource
              - dynamodb:Query
              - dynamodb:UpdateItem
              - dynamodb:DescribeTimeToLive
              - dynamodb:DescribeTable
              - dynamodb:GetItem
              - dynamodb:GetRecords
            Resource:
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/UserApplications*/index/*
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/UserApplications*
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/UserApplications*/stream/*
      Roles:
        - !Ref UserdetailsRole

  UserdetailsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub
                  - ${pProductName}-role-${ResourceName}
                  - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref pOidcConnectProvider 
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                !Sub 
                  - ${ClusterOidcIssuerUrl}:sub: "system:serviceaccount:${pProductName}:${pServiceAccountName}"
                  - ClusterOidcIssuerUrl: 
                      Fn::ImportValue:
                        Fn::Sub: ${pRegolithStackName}-ClusterOidcIssuerUrl
                !Sub
                  - ${ClusterOidcIssuerUrl}:aud: "sts.amazonaws.com"
                  - ClusterOidcIssuerUrl: 
                      Fn::ImportValue:
                        Fn::Sub: ${pRegolithStackName}-ClusterOidcIssuerUrl
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonCognitoPowerUser


Outputs:

  UserdetailsRepositoryArn:
    Description: !Sub The ECR repository ARN for the ${pProductName} service
    Value: !GetAtt UserdetailsRepository.Arn

  UserdetailsRepositoryName:
    Description: !Sub The ECR repository ARN for the ${pProductName} service
    Value: !Ref UserdetailsRepository

  UserdetailsRepositoryUri:
    Description: !Sub The ECR repository ARN for the ${pProductName} service
    Value: !GetAtt UserdetailsRepository.RepositoryUri
    Export:
      Name: !Sub ${AWS::StackName}-UserdetailsRepositoryUri

  UserdetailsSecret:
    Description: !Sub The Secrets name for ${pProductName}
    Value: !Ref UserdetailsSecret

  UserdetailsRoleArn:
    Description: !Sub The name of the ${pProductName} role
    Value: !GetAtt UserdetailsRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-UserdetailsRoleArn