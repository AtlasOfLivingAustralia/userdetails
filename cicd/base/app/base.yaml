AWSTemplateFormatVersion: '2010-09-09'

Description: Base resources for the Userdetails service

Parameters:
  pBuild:
    Type: String
    Description: The build number
  pCleanBranch:
    Type: String
    Description: The clean branch, can be used in resource names
  pClusterOidcIssuerUrl:
    Type: String
    Description: The OIDC issuer URL for the cluster
  pEnvironment:
    Type: String
    Description: The AWS environment this belongs to
  pProductName:
    Type: String
    Description: The name of the product
  pOidcConnectProvider:
    Type: String
    Description: The OIDC connect provider
  pServiceAccountName:
    Type: String
    Description: The name of the service account

Conditions:

  IsDev: !Equals
    - !Ref pEnvironment
    - development
  NotProd: !Not
    - !Equals
      - !Ref pEnvironment
      - production
  IsFirstBuild: !Equals [!Ref pBuild, "1"]

Resources:

  UserdetailsRepository:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: !If [ NotProd, true, false ]
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      RepositoryName: !Sub
                         - ${pProductName}-${ResourceName}
                         - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      RepositoryPolicyText:
        Version: 2012-10-17
        Statement:
          - Sid: AllowPublicPull
            Effect: Allow
            Principal: '*'
            Action:
              - 'ecr:GetDownloadUrlForLayer'
              - 'ecr:BatchGetImage'
              - 'ecr:BatchCheckLayerAvailability'
      Tags:
        - Key: Environment
          Value: !Ref pEnvironment
        - Key: Branch
          Value: !Ref pCleanBranch

  UserdetailsSecret:
    Type: 'AWS::SecretsManager::Secret'
    Properties:
      Name: !Sub 
              - ${pProductName}-${ResourceName}
              - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      Description: !Sub Userdetails app ${pEnvironment} secrets
      SecretString: !If
              - IsFirstBuild
              - |
                {
                   "userdetails_oidc_secret" : "",
                   "userdetails_endpoint_password" : "",
                   "oauth_providers_flickr_secret" : "",
                   "oauth_providers_inaturalist_secret" : "",
                   "userdetails_jwt_secret" : ""
                }
              - !Ref "AWS::NoValue"

  UserdetailsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: !Sub Permissions to deploy ${pProductName}
      ManagedPolicyName: !Sub 
                           - ${pProductName}-policy-${ResourceName}
                           - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendTemplatedEmail
              - ses:SendRawEmail
            Resource:
              - "*"
          - Effect: Allow
            Action:
              - apigateway:POST
              - apigateway:GET
            Resource:
              - "*"
          - Effect: Allow
            Action:
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:UpdateTimeToLive
              - dynamodb:ConditionCheckItem
              - dynamodb:PutItem
              - dynamodb:DeleteItem
              - dynamodb:Scan
              - dynamodb:ListTagsOfResource
              - dynamodb:Query
              - dynamodb:UpdateItem
              - dynamodb:DescribeTimeToLive
              - dynamodb:DescribeTable
              - dynamodb:GetItem
              - dynamodb:GetRecords
            Resource:
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/UserApplications*/index/*
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/UserApplications*
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/UserApplications*/stream/*
      Roles:
        - !Ref UserdetailsRole

  UserdetailsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub
                  - ${pProductName}-role-${ResourceName}
                  - ResourceName: !If [ IsDev, !Ref pCleanBranch, !Ref pEnvironment ]
      AssumeRolePolicyDocument: !Sub |
          {
            "Version": "2012-10-17",
            "Statement": [
                {
                    "Effect": "Allow",
                    "Principal": {
                        "Federated": "${pOidcConnectProvider}"
                    },
                    "Action": "sts:AssumeRoleWithWebIdentity",
                    "Condition": {
                        "StringEquals": {
                                          "${pClusterOidcIssuerUrl}:sub": "system:serviceaccount:${pProductName}:${pServiceAccountName}",
                                          "${pClusterOidcIssuerUrl}:aud": "sts.amazonaws.com"
                        }
                    }
                }
            ]
          }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonCognitoPowerUser


Outputs:

  UserdetailsRepositoryArn:
    Description: The ECR repository ARN for the userdetails service
    Value: !GetAtt UserdetailsRepository.Arn

  UserdetailsRepositoryName:
    Description: The ECR repository ARN for the userdetails service
    Value: !Ref UserdetailsRepository

  UserdetailsRepositoryUri:
    Description: The ECR repository ARN for the userdetails service
    Value: !GetAtt UserdetailsRepository.RepositoryUri
    Export:
      Name: !Sub ${AWS::StackName}-UserdetailsRepositoryUri

  UserdetailsSecretArn:
    Description: The Secrets name for userdetails
    Value: !Ref UserdetailsSecret
    Export:
      Name: !Sub ${AWS::StackName}-UserdetailsSecretArn

  UserdetailsRoleArn:
    Description: The name of the userdetails role
    Value: !GetAtt UserdetailsRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-UserdetailsRoleArn